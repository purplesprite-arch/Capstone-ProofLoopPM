<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#172338" />
  <title>ProofLoop — Morning Briefing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Mobile top bar -->
    <header class="topbar">
      <span class="brand"><span class="brand-mark"><svg class="icon"><use href="#spark" /></svg></span>ProofLoop</span>
      <div class="ws">
        <span class="ws-name">Workspace</span>
        <span class="ws-context">context</span>
      </div>
      <button class="user-ava" data-view="profile" aria-label="Open your profile">MO</button>
    </header>

    <!-- Desktop sidebar -->
    <aside class="sidebar">
      <span class="brand"><span class="brand-mark"><svg class="icon"><use href="#spark" /></svg></span>ProofLoop</span>
      <div class="ws-card">
        <span class="ws-icon">AV</span>
        <div>
          <span class="ws-name">Workspace</span>
          <span class="ws-context">context</span>
        </div>
      </div>
      <nav>
        <button class="tab" data-view="today" data-tab="today"><svg class="icon"><use href="#sun" /></svg>Today</button>
        <button class="tab" data-view="decisions" data-tab="decisions"><svg class="icon"><use href="#list" /></svg>Decisions<span class="tab-badge" data-count="decisions">0</span></button>
        <button class="tab" data-view="agents" data-tab="agents"><svg class="icon"><use href="#robot" /></svg>Agent team</button>
        <button class="tab" data-view="evidence" data-tab="evidence"><svg class="icon"><use href="#nodes" /></svg>Evidence</button>
        <button class="tab" data-view="build" data-tab="build"><svg class="icon"><use href="#layers" /></svg>Build</button>
        <button class="tab" data-view="memory" data-tab="memory"><svg class="icon"><use href="#history" /></svg>Memory</button>
      </nav>
      <button class="user-card" data-view="profile" aria-label="Open your profile">
        <span class="user-ava">MO</span>
        <span class="user-info">
          <span class="user-name">User</span>
          <span class="user-role">Role</span>
        </span>
      </button>
    </aside>

    <!-- View mount -->
    <main id="view" class="view"></main>

    <!-- Mobile bottom tab bar -->
    <nav class="tabbar">
      <button class="tab" data-view="today" data-tab="today"><svg class="icon"><use href="#sun" /></svg>Today</button>
      <button class="tab" data-view="decisions" data-tab="decisions"><svg class="icon"><use href="#list" /></svg>Decisions<span class="tab-badge" data-count="decisions">0</span></button>
      <button class="tab" data-view="agents" data-tab="agents"><svg class="icon"><use href="#robot" /></svg>Agents</button>
      <button class="tab" data-view="evidence" data-tab="evidence"><svg class="icon"><use href="#nodes" /></svg>Evidence</button>
      <button class="tab" data-view="build" data-tab="build"><svg class="icon"><use href="#layers" /></svg>Build</button>
      <button class="tab" data-view="memory" data-tab="memory"><svg class="icon"><use href="#history" /></svg>Memory</button>
    </nav>
  </div>

  <!-- Modal (bottom sheet on mobile, dialog on desktop) -->
  <div id="modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true"><div id="modal-body"></div></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="toast-ic"><svg class="icon"><use href="#check" /></svg></span>
    <div><strong>Saved</strong><p>message</p></div>
    <button class="icon-btn" data-dismiss aria-label="Dismiss"><svg class="icon"><use href="#x" /></svg></button>
  </div>

  <!-- Icon sprite -->
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg">
    <symbol id="spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="arrow-right" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
    <symbol id="arrow-left" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
    <symbol id="chevron-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
    <symbol id="chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
    <symbol id="link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="alert" viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><line x1="12" y1="9" x2="12" y2="14"/><line x1="12" y1="17" x2="12" y2="17"/></symbol>
    <symbol id="history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><polyline points="3 3 3 8 8 8"/><polyline points="12 8 12 12 15 14"/></symbol>
    <symbol id="git-branch" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="8" r="2.4"/><path d="M6 8.5v7"/><path d="M18 10.5a6 6 0 0 1-6 6H6"/></symbol>
    <symbol id="trend-up" viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></symbol>
    <symbol id="compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polygon points="16 8 13 13 8 16 11 11"/></symbol>
    <symbol id="gauge" viewBox="0 0 24 24"><path d="M4 18a8 8 0 1 1 16 0"/><line x1="12" y1="18" x2="15.5" y2="10.5"/><circle cx="12" cy="18" r="1.2"/></symbol>
    <symbol id="pulse" viewBox="0 0 24 24"><polyline points="3 12 8 12 10 6 14 18 16 12 21 12"/></symbol>
    <symbol id="nodes" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.3"/><circle cx="18" cy="7" r="2.3"/><circle cx="9" cy="18" r="2.3"/><line x1="7.6" y1="7.6" x2="8.4" y2="15.8"/><line x1="8.2" y1="5.7" x2="15.7" y2="6.6"/></symbol>
    <symbol id="file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/></symbol>
    <symbol id="shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></symbol>
    <symbol id="rocket" viewBox="0 0 24 24"><path d="M5 15c-1 1-1.4 4-1.4 4s3-.4 4-1.4"/><path d="M9.5 15.5 8 14c1-5 5-9 11-9 0 6-4 10-9 11z"/><circle cx="14.5" cy="9.5" r="1.4"/></symbol>
    <symbol id="layers" viewBox="0 0 24 24"><polygon points="12 3 21 8 12 13 3 8"/><polyline points="3 12 12 17 21 12"/><polyline points="3 16 12 21 21 16"/></symbol>
    <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.7" y2="6.7"/><line x1="17.3" y1="17.3" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.7" y2="17.3"/><line x1="17.3" y1="6.7" x2="19.1" y2="4.9"/></symbol>
    <symbol id="time-1" viewBox="0 0 24 24"><rect x="4" y="15" width="4" height="6" rx="1"/><rect x="10" y="10" width="4" height="11" rx="1" opacity=".3"/><rect x="16" y="5" width="4" height="16" rx="1" opacity=".3"/></symbol>
    <symbol id="time-2" viewBox="0 0 24 24"><rect x="4" y="15" width="4" height="6" rx="1"/><rect x="10" y="10" width="4" height="11" rx="1"/><rect x="16" y="5" width="4" height="16" rx="1" opacity=".3"/></symbol>
    <symbol id="time-3" viewBox="0 0 24 24"><rect x="4" y="15" width="4" height="6" rx="1"/><rect x="10" y="10" width="4" height="11" rx="1"/><rect x="16" y="5" width="4" height="16" rx="1"/></symbol>
    <symbol id="list" viewBox="0 0 24 24"><line x1="8" y1="7" x2="20" y2="7"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="17" x2="20" y2="17"/><circle cx="4" cy="7" r=".9"/><circle cx="4" cy="12" r=".9"/><circle cx="4" cy="17" r=".9"/></symbol>
    <symbol id="robot" viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="10" rx="2.5"/><line x1="12" y1="4.5" x2="12" y2="8"/><circle cx="12" cy="4" r="1.1"/><circle cx="9.5" cy="13" r="1"/><circle cx="14.5" cy="13" r="1"/></symbol>
    <symbol id="image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5.5-5.5-4 4L8 11l-5 5"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polygon points="10 8.5 16 12 10 15.5" fill="currentColor" stroke="none"/></symbol>
  </svg>

  <!-- Scripts: data first (plain global), then render, then app. No modules — opens over file://. -->
  <script src="data.js"></script>
  <script src="render.js"></script>
  <script src="app.js"></script>
</body>
</html>
